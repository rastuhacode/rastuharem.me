packages: []

catalogMode: prefer

catalogs:
  backend:
    better-sqlite3: ^12.6.2
  build:
    '@iconify-json/simple-icons': ^1.2.69
    '@iconify-json/twemoji': ^1.2.5
    '@nuxt/content': ^3.11.0
    '@nuxt/icon': ^2.2.1
    '@nuxt/image': ^2.0.0
    '@nuxtjs/i18n': ^10.2.1
    '@tailwindcss/typography': ^0.5.19
    '@tailwindcss/vite': ^4.1.18
    nuxt: ^4.3.0
    tailwindcss: ^4.1.18
    tw-animate-css: ^1.4.0
  dev:
    '@nuxt/eslint': ^1.13.0
    eslint: ^9.39.2
    pnpm: ^10.28.2
    typescript: ~5.9.3
  frontend:
    '@vueuse/core': ^14.2.0
    '@vueuse/nuxt': ^14.2.0
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    reka-ui: ^2.8.0
    tailwind-merge: ^3.4.0
  types:
