packages: []

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  pnpm: false
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalog:

catalogMode: prefer

catalogs:
  build:
    "@iconify-json/lucide": ^1.2.137
    "@iconify-json/simple-icons": ^1.2.97
    "@iconify-json/twemoji": ^1.2.5
    "@nuxt/content": ^3.16.1
    "@nuxt/icon": ^2.5.1
    "@nuxt/image": ^2.1.0
    "@nuxtjs/color-mode": ^4.0.1
    "@nuxtjs/i18n": ^10.6.0
    "@nuxtjs/robots": ^6.2.3
    "@nuxtjs/sitemap": ^8.5.1
    "@tailwindcss/typography": ^0.5.20
    "@tailwindcss/vite": ^4.3.3
    nuxt: ^4.5.2
    nuxt-link-checker: ^5.3.0
    nuxt-site-config: ^4.2.3
    nuxtseo-layer-devtools: ^5.3.16
    tailwindcss: ^4.3.3
    tw-animate-css: ^1.4.0
  dev:
    "@nuxt/eslint": ^1.17.0
    eslint: ^10.11.0
    pnpm: ^12.6.0
    typescript: ~6.0.3
    vue-tsc: ^3.3.11
  frontend:
    "@vueuse/core": ^15.0.0
    "@vueuse/nuxt": ^15.0.0
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    motion-v: ^2.4.4
    pixi.js: ^8.21.0
    reka-ui: ^2.10.5
    tailwind-merge: ^3.7.0
    zod: ^4.6.5
  types:
    "@types/node": ^26.6.3
  scripts:
    ansis: ^4.4.0
    prompts: ^2.4.2
    sharp: ^0.35.4
    simple-git: ^4.0.2
    tsx: ^4.23.15

minimumReleaseAgeExclude:
