packages: []

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalogMode: prefer

catalogs:
  build:
    "@iconify-json/lucide": ^1.2.123
    "@iconify-json/simple-icons": ^1.2.93
    "@iconify-json/twemoji": ^1.2.5
    "@nuxt/content": ^3.15.2
    "@nuxt/icon": ~2.3.1
    "@nuxt/image": ^2.1.0
    "@nuxtjs/color-mode": ^4.0.1
    "@nuxtjs/i18n": ^10.6.0
    "@nuxtjs/robots": ^6.1.4
    "@nuxtjs/sitemap": ^8.3.4
    "@tailwindcss/typography": ^0.5.20
    "@tailwindcss/vite": ^4.3.3
    nuxt: ^4.5.2
    nuxt-link-checker: ^5.1.3
    nuxt-site-config: ^4.2.2
    tailwindcss: ^4.3.3
    tw-animate-css: ^1.4.0
  dev:
    "@nuxt/eslint": ^1.17.0
    eslint: ^10.8.1
    pnpm: ^11.21.0
    typescript: ~6.0.3
  frontend:
    "@vueuse/core": ^14.4.0
    "@vueuse/nuxt": ^14.4.0
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    motion-v: ^2.3.0
    reka-ui: ^2.10.3
    tailwind-merge: ^3.6.0
    zod: ^4.4.3
  types:
    "@types/node": ^26.2.0
  scripts:
    ansis: ^4.3.1
    prompts: ^2.4.2
    sharp: ^0.35.3
    simple-git: ^3.36.0
    tsx: ^4.23.12

minimumReleaseAgeExclude:
  - reka-ui@2.9.9
  - pnpm@11.6.0 || 11.15.1 || 11.18.0
  - "@img/sharp-darwin-arm64@0.35.3"
  - "@img/sharp-darwin-x64@0.35.3"
  - "@img/sharp-freebsd-wasm32@0.35.3"
  - "@img/sharp-linux-arm64@0.35.3"
  - "@img/sharp-linux-arm@0.35.3"
  - "@img/sharp-linux-ppc64@0.35.3"
  - "@img/sharp-linux-riscv64@0.35.3"
  - "@img/sharp-linux-s390x@0.35.3"
  - "@img/sharp-linux-x64@0.35.3"
  - "@img/sharp-linuxmusl-arm64@0.35.3"
  - "@img/sharp-linuxmusl-x64@0.35.3"
  - "@img/sharp-wasm32@0.35.3"
  - "@img/sharp-webcontainers-wasm32@0.35.3"
  - "@img/sharp-win32-arm64@0.35.3"
  - "@img/sharp-win32-ia32@0.35.3"
  - "@img/sharp-win32-x64@0.35.3"
  - "@nuxt/icon@2.3.0"
  - "@types/node@26.1.0"
  - sharp@0.35.3
  - "@iconify-json/simple-icons@1.2.91"
  - "@nuxtjs/robots@6.1.3"
  - "@nuxtjs/sitemap@8.2.3"
  - nuxt-link-checker@5.1.3
  - nuxt-site-config-kit@4.1.2 || 4.2.2
  - nuxt-site-config@4.1.2 || 4.2.2
  - site-config-stack@4.1.2 || 4.2.2
  - "@nuxt/image@2.1.0"
  - "@vueuse/core@14.4.0"
  - "@vueuse/metadata@14.4.0"
  - "@vueuse/nuxt@14.4.0"
  - "@vueuse/shared@14.4.0"

onlyBuiltDependencies:
  - esbuild
  - sharp

shellEmulator: true
