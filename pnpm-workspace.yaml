packages: []

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalogMode: prefer

catalogs:
  build:
    "@iconify-json/lucide": ^1.2.111
    "@iconify-json/simple-icons": ^1.2.86
    "@iconify-json/twemoji": ^1.2.5
    "@nuxt/content": ^3.14.0
    "@nuxt/icon": ^2.2.3
    "@nuxt/image": ^2.0.0
    "@nuxtjs/color-mode": ^4.0.1
    "@nuxtjs/i18n": ^10.4.0
    "@tailwindcss/typography": ^0.5.20
    "@tailwindcss/vite": ^4.3.0
    nuxt: ^4.4.8
    tailwindcss: ^4.3.0
    tw-animate-css: ^1.4.0
  dev:
    "@nuxt/eslint": ^1.16.0
    eslint: ^10.4.1
    pnpm: ^11.6.0
    typescript: ~6.0.3
  frontend:
    "@vueuse/core": ^14.3.0
    "@vueuse/nuxt": ^14.3.0
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    motion-v: ^2.3.0
    reka-ui: ^2.9.10
    tailwind-merge: ^3.6.0
  types:
    "@types/node": ^25.9.3
  scripts:
    ansis: ^4.3.1
    prompts: ^2.4.2
    sharp: ^0.35.0
    simple-git: ^3.36.0
    tsx: ^4.21.0

minimumReleaseAgeExclude:
  - reka-ui@2.9.9
  - pnpm@11.6.0

onlyBuiltDependencies:
  - esbuild
  - sharp

shellEmulator: true
