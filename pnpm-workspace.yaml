packages: []

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalogMode: prefer

catalogs:
  build:
    "@iconify-json/lucide": ^1.2.111
    "@iconify-json/simple-icons": ^1.2.85
    "@iconify-json/twemoji": ^1.2.5
    "@nuxt/content": ^3.14.0
    "@nuxt/icon": ^2.2.3
    "@nuxt/image": ^2.0.0
    "@nuxtjs/color-mode": ^4.0.0
    "@nuxtjs/i18n": ^10.4.0
    "@tailwindcss/typography": ^0.5.19
    "@tailwindcss/vite": ^4.3.0
    nuxt: 4.4.6
    tailwindcss: ^4.3.0
    tw-animate-css: ^1.4.0
  dev:
    "@nuxt/eslint": ^1.15.2
    eslint: ^10.4.1
    pnpm: ^11.5.1
    typescript: ~6.0.3
  frontend:
    "@vueuse/core": ^14.3.0
    "@vueuse/nuxt": ^14.3.0
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    motion-v: ^2.2.1
    reka-ui: ^2.9.9
    tailwind-merge: ^3.6.0
  types:
    "@types/node": ^25.9.1

minimumReleaseAgeExclude:
  - reka-ui@2.9.9

onlyBuiltDependencies:
  - esbuild
  - sharp

shellEmulator: true
